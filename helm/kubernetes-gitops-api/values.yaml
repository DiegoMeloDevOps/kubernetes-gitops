# os values servem para ao inves de deixarmos valores hardcoded 
# modificamos ele aqui, e ao inves de ir no arquivo linha por linha
# modificamos eles diretamente aqui para os valores que queremos

replicaCount: 3

image:
  repository: diegomelodevops/kubernetes-gitops-api
  tag: "1.3.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

environment: dev
